name: Build target
description: Build one target and architecture into a .deb and an image pushed by digest

inputs:
  target: {required: true}
  arch: {required: true}
  platform: {required: true}
  source_repo: {required: true}
  source_ref: {required: true}
  image: {required: true}
  version: {required: true}
  branch: {required: true}
  push: {required: true}
  token: {required: true}
  ffmpeg_image:
    description: Image from the Dockerfile ffmpeg stage; empty compiles or downloads FFmpeg
    default: ''
  webui_on_runner:
    description: Build the web UI on the runner instead of inside the target container
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}
        path: src
        submodules: recursive

    - uses: actions/setup-node@v4
      if: inputs.webui_on_runner == 'true'
      with:
        node-version: 22

    - name: Web UI
      if: inputs.webui_on_runner == 'true'
      shell: bash
      working-directory: src
      run: |
        set -euo pipefail
        mkdir -p c127-webui
        npm ci --ignore-scripts
        SUNSHINE_SOURCE_ASSETS_DIR="$PWD/src_assets" SUNSHINE_ASSETS_DIR="$PWD/c127-webui" npm run build
        test -f c127-webui/assets/web/index.html
        rm -rf node_modules

    - uses: docker/setup-qemu-action@v3
      if: runner.arch == 'X64' && inputs.platform != 'linux/amd64'

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build .deb
      uses: docker/build-push-action@v6
      with:
        context: src
        file: .packaging/Dockerfile
        build-contexts: packaging=.packaging
        build-args: |
          TARGET=${{ inputs.target }}
          BUILD_VERSION=${{ inputs.version }}
          BRANCH=${{ inputs.branch }}
          COMMIT=${{ inputs.source_ref }}
          ${{ inputs.ffmpeg_image && format('FFMPEG_IMAGE={0}', inputs.ffmpeg_image) || '' }}
        platforms: ${{ inputs.platform }}
        target: deb
        outputs: type=local,dest=out
        cache-from: type=gha,scope=${{ inputs.target }}-${{ inputs.arch }}
        cache-to: type=gha,mode=max,scope=${{ inputs.target }}-${{ inputs.arch }}

    - name: Build and push image by digest
      id: push
      uses: docker/build-push-action@v6
      with:
        context: src
        file: .packaging/Dockerfile
        build-contexts: packaging=.packaging
        build-args: |
          TARGET=${{ inputs.target }}
          BUILD_VERSION=${{ inputs.version }}
          BRANCH=${{ inputs.branch }}
          COMMIT=${{ inputs.source_ref }}
          ${{ inputs.ffmpeg_image && format('FFMPEG_IMAGE={0}', inputs.ffmpeg_image) || '' }}
        platforms: ${{ inputs.platform }}
        target: runtime
        outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
        cache-from: type=gha,scope=${{ inputs.target }}-${{ inputs.arch }}

    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p digests dist
        digest="${{ steps.push.outputs.digest }}"
        touch "digests/${digest#sha256:}"
        mv out/sunshine.deb "dist/sunshine-${{ inputs.target }}-${{ inputs.arch }}.deb"

    - uses: actions/upload-artifact@v4
      with:
        name: deb-${{ inputs.target }}-${{ inputs.arch }}
        path: dist/*.deb
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      if: inputs.push == 'true'
      with:
        name: digest-${{ inputs.target }}-${{ inputs.arch }}
        path: digests/*
        if-no-files-found: error
